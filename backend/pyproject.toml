[project]
name = "piyasa-takip-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "sqlalchemy==2.0.43",
  "alembic==1.16.5", "psycopg[binary]==3.2.10", "pydantic-settings==2.10.1",
  "firebase-admin==7.1.0", "httpx==0.28.1", "openai==1.107.2"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0", "ruff==0.12.12"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008"]
