services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: piyasa, POSTGRES_USER: piyasa, POSTGRES_PASSWORD: piyasa}
    volumes: [piyasa-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U piyasa"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: .
    env_file: backend/.env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    env_file: backend/.env
    depends_on: {db: {condition: service_healthy}}
    command: python -m app.worker
    restart: unless-stopped
volumes: {piyasa-db: {}}
